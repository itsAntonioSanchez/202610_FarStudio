# Publishes the website: every push to main that changes website/ copies that folder
# (and only that folder) to the website-prod branch, which Cloudflare Pages deploys.
name: Publish website

on:
  push:
    branches: [main]
    paths: ['website/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-website
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check that the site builds
        run: node website/build.mjs

      - name: Copy website/ to website-prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B website-prod origin/website-prod
          git rm -r -q --ignore-unmatch website
          git checkout "$GITHUB_SHA" -- website
          if git diff --cached --quiet; then
            echo "website-prod is already up to date."
            exit 0
          fi
          git commit -m "Publish website from main@${GITHUB_SHA::7}"
          git push origin website-prod
